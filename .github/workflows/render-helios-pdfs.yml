name: Render Helios PDFs
on:
  push:
    branches:
      - tmp/helios-pdf-render
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out render source
        uses: actions/checkout@v4
      - name: Apply final layout corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          operator = Path('Helios_One_Operational_World_v0.1.tex')
          lines = operator.read_text().splitlines()
          lines = [
              line for line in lines
              if not ('\\tagcurrent' in line and '\\tagplanned' in line)
          ]
          operator.write_text('\n'.join(lines) + '\n')

          tech = Path('Helios_Tech_Part2.tex')
          text = tech.read_text()
          marker = r'\begin{tikzpicture}[x=.78cm,y=.72cm]'
          if marker in text and r'\resizebox{.92\linewidth}{!}{%' not in text:
              pos = text.index(marker)
              text = text[:pos] + r'\resizebox{.92\linewidth}{!}{%' + '\n' + text[pos:]
              close = text.index(r'\end{tikzpicture}', pos)
              close += len(r'\end{tikzpicture}')
              text = text[:close] + '}' + text[close:]
          text = text.replace(
              r'\begin{frame}{Media, integration, identity, and trust}',
              r'\begin{frame}[shrink=8]{Media, integration, identity, and trust}'
          )
          text = text.replace(
              r'\begin{frame}{Degraded operation, delivery, and status}',
              r'\begin{frame}[shrink=12]{Degraded operation, delivery, and status}'
          )
          tech.write_text(text)
          PY
      - name: Compile operator guide
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Helios_One_Operational_World_v0.1.tex
      - name: Compile technical overview
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Helios_How_the_System_Works_v0.1.tex
      - name: Reject layout overflow
        run: |
          if grep -Hn 'Overfull \\[hv]box' Helios_One_Operational_World_v0.1.log Helios_How_the_System_Works_v0.1.log; then
            echo 'Layout overflow detected.' >&2
            exit 1
          fi
      - name: Verify PDF structure, text, and page rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          test "$(pdfinfo Helios_One_Operational_World_v0.1.pdf | awk '/^Pages:/ {print $2}')" = "8"
          test "$(pdfinfo Helios_How_the_System_Works_v0.1.pdf | awk '/^Pages:/ {print $2}')" = "10"
          pdftotext Helios_One_Operational_World_v0.1.pdf - | grep -q 'One Operational World'
          pdftotext Helios_How_the_System_Works_v0.1.pdf - | grep -q 'How the System Works'
          mkdir -p qa/operator qa/technical
          pdftoppm -png -r 72 -q Helios_One_Operational_World_v0.1.pdf qa/operator/page
          pdftoppm -png -r 72 -q Helios_How_the_System_Works_v0.1.pdf qa/technical/page
          test "$(find qa/operator -name 'page-*.png' | wc -l)" = "8"
          test "$(find qa/technical -name 'page-*.png' | wc -l)" = "10"
          sha256sum Helios_One_Operational_World_v0.1.pdf Helios_How_the_System_Works_v0.1.pdf > Helios_PDF_SHA256SUMS.txt
      - name: Commit rendered PDFs to temporary branch
        run: |
          git config user.name "Helios PDF Renderer"
          git config user.email "llmx@texasfortress.ai"
          git add Helios_One_Operational_World_v0.1.pdf Helios_How_the_System_Works_v0.1.pdf Helios_PDF_SHA256SUMS.txt
          git commit -m "temporary rendered Helios PDFs [skip ci]"
          git push origin HEAD:tmp/helios-pdf-render
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: helios-client-pdfs
          if-no-files-found: error
          path: |
            Helios_One_Operational_World_v0.1.pdf
            Helios_How_the_System_Works_v0.1.pdf
            Helios_PDF_SHA256SUMS.txt
