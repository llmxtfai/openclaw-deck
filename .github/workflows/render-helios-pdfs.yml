name: Render Helios PDFs
on:
  push:
    branches:
      - tmp/helios-pdf-render
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out render source
        uses: actions/checkout@v4
      - name: Normalize TikZ text color syntax
        run: |
          sed -i 's/\\node\[text,/\\node[text=text,/g' Helios_One_Operational_World_v0.1.tex Helios_How_the_System_Works_v0.1.tex Helios_Tech_Part2.tex
      - name: Compile operator guide
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Helios_One_Operational_World_v0.1.tex
      - name: Compile technical overview
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Helios_How_the_System_Works_v0.1.tex
      - name: Commit rendered PDFs to temporary branch
        run: |
          git config user.name "Helios PDF Renderer"
          git config user.email "llmx@texasfortress.ai"
          git add Helios_One_Operational_World_v0.1.pdf Helios_How_the_System_Works_v0.1.pdf
          git commit -m "temporary rendered Helios PDFs [skip ci]"
          git push origin HEAD:tmp/helios-pdf-render
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: helios-client-pdfs
          if-no-files-found: error
          path: |
            Helios_One_Operational_World_v0.1.pdf
            Helios_How_the_System_Works_v0.1.pdf
